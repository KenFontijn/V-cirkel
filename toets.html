<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="V-Cirkel Toets">
<meta name="theme-color" content="#C8651A">
<title>V-Cirkel Toets</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --orange: #C8651A;
  --orange-light: #F5E8D8;
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --surface2: #F4F2EE;
  --text: #1A1A18;
  --text2: #5A5A54;
  --text3: #9A9A90;
  --border: rgba(0,0,0,0.10);
  --radius: 12px;
  --good: #1A5A1A;
  --good-bg: #E3F0E3;
  --bad: #A03010;
  --bad-bg: #F8E2DB;
  --mid: #8A5A00;
  --mid-bg: #F7EBC4;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; color: var(--text); -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; }
button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; text-align: left; -webkit-appearance: none; appearance: none; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 640px; margin: 0 auto; padding-bottom: calc(40px + var(--safe-bottom)); }

.header { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 12px; position: sticky; top: 0; z-index: 10; }
.header-logo { display: flex; align-items: center; gap: 10px; }
.logo-dot { width: 28px; height: 28px; background: var(--orange); border-radius: 50%; flex-shrink: 0; }
.hl { flex: 1; min-width: 0; }
.header h1 { font-size: 20px; font-weight: 600; }
.header p { font-size: 13px; color: var(--text2); margin-top: 2px; }
.applink { font-size: 12px; font-weight: 600; color: var(--orange); background: var(--orange-light); padding: 6px 12px; border-radius: 16px; }

.content { padding: 16px; }
.card { background: var(--surface); border-radius: var(--radius); border: 0.5px solid var(--border); margin-bottom: 12px; overflow: hidden; }
.pad { padding: 14px 16px; }
.sec-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.sub { font-size: 12px; color: var(--text3); line-height: 1.4; }
.lbl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); margin: 14px 0 6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 500; color: var(--text2); }
.chip.on { background: var(--orange); border-color: var(--orange); color: #fff; }
.chip.num { min-width: 38px; text-align: center; padding: 6px 0; }
.toggle { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 14px; color: var(--text2); }
.toggle input { width: 20px; height: 20px; accent-color: var(--orange); }
.btn { display: block; width: 100%; margin-top: 16px; padding: 15px; background: var(--orange); color: #fff; font-size: 16px; font-weight: 600; border-radius: 12px; text-align: center; }
.btn[disabled] { opacity: 0.4; pointer-events: none; }
.btn.sec { background: var(--surface2); color: var(--text); }
.btn.line { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
.btn.danger { background: var(--surface); border: 1px solid var(--bad); color: var(--bad); }

.banner { margin: 12px 16px 0; padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.45; }
.banner.warn { background: var(--mid-bg); color: var(--mid); }
.banner.err { background: var(--bad-bg); color: var(--bad); }
.banner.ok { background: var(--surface2); color: var(--text2); }

.bar { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--orange); border-radius: 3px; }
.srow { padding: 10px 0; border-bottom: 0.5px solid var(--border); }
.srow:last-child { border-bottom: none; }
.srow .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 8px; }
.srow .nm { font-size: 14px; font-weight: 600; }
.srow .st { font-size: 12px; color: var(--text2); text-align: right; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-left: 6px; }
.pill.g { background: var(--good-bg); color: var(--good); }
.pill.m { background: var(--mid-bg); color: var(--mid); }
.pill.b { background: var(--bad-bg); color: var(--bad); }
.pill.n { background: var(--surface2); color: var(--text3); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.tile { background: var(--surface2); border-radius: 10px; padding: 10px 6px; text-align: center; }
.tile .tn { font-size: 12px; color: var(--text2); font-weight: 600; }
.tile .tp { font-size: 18px; font-weight: 700; margin: 2px 0; }
.tile .ts { font-size: 10px; color: var(--text3); }
.tile.g { background: var(--good-bg); } .tile.g .tp { color: var(--good); }
.tile.m { background: var(--mid-bg); } .tile.m .tp { color: var(--mid); }
.tile.b { background: var(--bad-bg); } .tile.b .tp { color: var(--bad); }
.weak { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
.weak:last-child { border-bottom: none; }
.weak .wn { flex: 1; font-size: 14px; font-weight: 600; }
.weak .ws { font-size: 12px; color: var(--text2); }
.weak .go { font-size: 12px; font-weight: 600; color: var(--orange); }
.hard { padding: 8px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; color: var(--text2); line-height: 1.4; }
.hard:last-child { border-bottom: none; }
.hard b { color: var(--bad); }
details summary { font-size: 14px; font-weight: 600; cursor: pointer; padding: 14px 16px; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details .dbody { padding: 0 16px 14px; }
.note { font-size: 13px; color: var(--text2); line-height: 1.5; padding: 6px 0 6px 14px; position: relative; }
.note::before { content: "·"; position: absolute; left: 0; color: var(--orange); font-weight: bold; font-size: 16px; line-height: 1.2; }

.qhead .qtop { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.qhead .x { font-size: 13px; font-weight: 600; color: var(--text2); background: var(--surface2); padding: 6px 12px; border-radius: 16px; }
.qhead .qc { font-size: 14px; font-weight: 600; }
.qhead .qs { font-size: 13px; color: var(--good); font-weight: 600; min-width: 60px; text-align: right; }
.qtag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--orange); margin-bottom: 8px; }
.qtext { font-size: 17px; font-weight: 600; line-height: 1.4; }
.qquote { margin-top: 12px; background: var(--orange-light); border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.5; font-style: italic; }
.opts { margin-top: 4px; }
.opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; font-size: 15px; line-height: 1.4; min-height: 52px; }
.opt .olet { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--surface2); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; color: var(--text2); }
.opt:active { background: var(--surface2); }
.opt.good { border-color: var(--good); background: var(--good-bg); }
.opt.good .olet { background: var(--good); color: #fff; }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt.bad .olet { background: var(--bad); color: #fff; }
.opt.dim { opacity: 0.55; }
.opts.locked .opt { pointer-events: none; }
.fb { border-radius: 12px; padding: 14px 16px; margin-top: 4px; }
.fb.good { background: var(--good-bg); }
.fb.bad { background: var(--bad-bg); }
.fb .fh { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.fb.good .fh { color: var(--good); }
.fb.bad .fh { color: var(--bad); }
.fb .fa { font-size: 14px; line-height: 1.5; margin-bottom: 8px; }
.fb .fc { font-size: 13px; line-height: 1.5; color: var(--text2); border-top: 0.5px solid var(--border); padding-top: 8px; margin-top: 8px; }
.fb .fc b { color: var(--text); }
.big { font-size: 40px; font-weight: 700; color: var(--orange); }
.miss { padding: 10px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; line-height: 1.45; }
.miss:last-child { border-bottom: none; }
.miss .mq { color: var(--text2); }
.miss .ma { font-weight: 600; color: var(--good); margin-top: 2px; }
.center { text-align: center; }
.tile.sel { outline: 2px solid var(--orange); outline-offset: -2px; }
.irow { margin-bottom: 12px; }
.il { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); margin-bottom: 4px; }
.inp { width: 100%; font-size: 16px; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); outline: none; -webkit-appearance: none; appearance: none; }
.inp:focus { border-color: var(--orange); }
.inp.good { border-color: var(--good); background: var(--good-bg); }
.inp.bad { border-color: var(--bad); background: var(--bad-bg); }
.igood { font-size: 13px; font-weight: 600; color: var(--good); margin-top: 4px; }
.slots { margin-bottom: 12px; }
.slot { display: block; width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.slot.act { border-color: var(--orange); box-shadow: 0 0 0 2px var(--orange-light); }
.slot.good { border-color: var(--good); background: var(--good-bg); }
.slot.bad { border-color: var(--bad); background: var(--bad-bg); }
.slot .sl { display: block; font-size: 12px; color: var(--text2); line-height: 1.35; margin-bottom: 4px; }
.slot .sv { display: block; font-size: 15px; font-weight: 600; min-height: 20px; }
.slot .ph { font-weight: 400; color: var(--text3); font-size: 13px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.bword { padding: 10px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; font-weight: 500; }
.bword.used { opacity: 0.3; pointer-events: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two .btn { margin-top: 0; text-align: center; }
.btn.good2 { background: var(--good); }
.btn.bad2 { background: var(--bad); }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="content"><div class="card pad center"><p class="sub">Laden...</p></div></div></div>
<noscript><div style="padding:20px">Deze toets heeft JavaScript nodig.</div></noscript>

<script>
(function () {
'use strict';

/* ============================================================
   Instellingen
   ============================================================ */
var APP_URL = 'index.html';
var STORE_KEY = 'vcirkel-toets-v1';
var DATA_KEY = 'vcirkel-toets-data-v1';

var TABS = [
  { k: 'vcirkel', n: 'V-Cirkel' },
  { k: 'polariteiten', n: 'Polariteiten' },
  { k: 'kenmerken', n: 'Kenmerken' },
  { k: 'kwadranten', n: 'Kwadranten' },
  { k: 'coaching', n: 'Coaching' }
];
var CENTRA_KEYS = ['Buik', 'Hart', 'Hoofd'];
/* Vraagsoorten (wat wordt er gevraagd) */
var GROUPS = [
  { k: 'std', n: 'Gewone vragen' },
  { k: 'who', n: 'Welk type of centrum is dit?' },
  { k: 'match', n: 'Koppelen' },
  { k: 'fill', n: 'Kwadranten invullen' }
];
/* Antwoordvormen (hoe antwoord je) */
var FORMS = [
  { k: 'auto', n: 'Automatisch oplopend' },
  { k: 'mc', n: 'Meerkeuze' },
  { k: 'typed', n: 'Typen' },
  { k: 'flip', n: 'Open met kaartje' }
];
var FORM_HELP = {
  auto: 'Nieuwe of foute vragen krijg je als meerkeuze (of woordenbank). Na een goed antwoord wordt het zwaarder: eerst typen, later open met kaartje. Fout? Dan weer de makkelijkste vorm.',
  mc: 'Altijd kiezen uit antwoorden (bij kwadranten invullen: woorden kiezen uit een woordenbank).',
  typed: 'Altijd zelf typen. Hoofdletters en spaties maken niet uit, de rest moet exact kloppen.',
  flip: 'Eerst zelf bedenken, dan het kaartje omdraaien en zelf beoordelen of je het wist.'
};
var MODE_LABEL = { mc: 'Meerkeuze', typed: 'Typen', flip: 'Open vraag', sb: 'Woordenbank', ft: 'Invullen', match: 'Koppelen' };
var VK = ['verslaving', 'verleiding', 'vermijding', 'verdediging'];
var VN = { verslaving: 'Verslaving', verleiding: 'Verleiding', vermijding: 'Vermijding', verdediging: 'Verdediging' };
var SECS = [
  { key: 'basis', label: 'Basispolariteiten' },
  { key: 'kk', label: 'Kernkwaliteiten' },
  { key: 'vc', label: 'Uit de V-cirkel' },
  { key: 'themas', label: "Typegebonden thema's" }
];
var KWF = [['vk', 'Valkuil'], ['al', 'Allergie'], ['ud', 'Uitdaging']];
var KWL = { kk: 'Kernkwaliteit', vk: 'Valkuil', al: 'Allergie', ud: 'Uitdaging' };
/* Leitner: gewicht per doos (0 = nog nooit gezien). Fout = doos 1. */
var BOXW = { 0: 3, 1: 6, 2: 3, 3: 1.6, 4: 0.8, 5: 0.35 };
var MASTERED_BOX = 4;

/* ============================================================
   Hulpfuncties
   ============================================================ */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function uniq(a, ex) {
  var seen = {}, r = [];
  (ex || []).forEach(function (x) { seen[x] = 1; });
  (a || []).forEach(function (x) {
    if (x == null || x === '') return;
    if (!seen[x]) { seen[x] = 1; r.push(x); }
  });
  return r;
}
function countBy(arr, fn) {
  var o = {};
  arr.forEach(function (x) { var k = fn(x); o[k] = (o[k] || 0) + 1; });
  return o;
}
function trunc(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '...' : s; }
function pct(x) { return Math.round(x * 100); }
function findBy(arr, fn) { for (var i = 0; i < (arr || []).length; i++) if (fn(arr[i])) return arr[i]; return null; }
function toggleIn(arr, v) { var i = arr.indexOf(v); if (i < 0) arr.push(v); else arr.splice(i, 1); }
function rnd(a) { return a[Math.floor(Math.random() * a.length)]; }

/* ============================================================
   Opslag (localStorage met veilige terugval)
   ============================================================ */
var storageOk = true;
function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { storageOk = false; return null; } }
function lsSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { storageOk = false; return false; } }
function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) { storageOk = false; } }
(function probe() {
  try { var x = '__probe'; window.localStorage.setItem(x, '1'); window.localStorage.removeItem(x); }
  catch (e) { storageOk = false; }
})();

function freshPrefs() {
  return { tabs: [], centra: [], types: [], kinds: [], form: 'auto', n: 10, weak: false, ign: false };
}
function freshState() { return { v: 2, q: {}, p: freshPrefs() }; }
var ST = freshState();
function loadState() {
  var raw = lsGet(STORE_KEY);
  if (!raw) return;
  try {
    var o = JSON.parse(raw);
    if (o && typeof o === 'object' && o.q && typeof o.q === 'object') {
      ST = freshState();
      ST.q = o.q;
      if (o.p && typeof o.p === 'object') {
        var d = freshPrefs();
        Object.keys(d).forEach(function (k) {
          var v = o.p[k];
          if (v == null) return;
          if (Array.isArray(d[k])) { if (Array.isArray(v)) ST.p[k] = v; }
          else if (typeof v === typeof d[k]) ST.p[k] = v;
        });
        if (!findBy(FORMS, function (f) { return f.k === ST.p.form; })) ST.p.form = 'auto';
      }
    }
  } catch (e) { ST = freshState(); }
}
function saveState() { if (storageOk) lsSet(STORE_KEY, JSON.stringify(ST)); }

/* ============================================================
   Data uit index.html halen (geen kopie: de app is de bron)
   ============================================================ */
function extractLiteral(src, name) {
  var m = new RegExp('var\\s+' + name + '\\s*=\\s*').exec(src);
  if (!m) throw new Error('niet gevonden: ' + name);
  var start = m.index + m[0].length, i = start;
  var open = src.charAt(i);
  if (open !== '[' && open !== '{') throw new Error('geen lijst of object: ' + name);
  var depth = 0, q = null;
  for (; i < src.length; i++) {
    var ch = src.charAt(i);
    if (q) {
      if (ch === '\\') i++;
      else if (ch === q) q = null;
      continue;
    }
    if (ch === "'" || ch === '"' || ch === '`') { q = ch; continue; }
    if (ch === '/' && src.charAt(i + 1) === '/') { while (i < src.length && src.charAt(i) !== '\n') i++; continue; }
    if (ch === '/' && src.charAt(i + 1) === '*') { i = src.indexOf('*/', i + 2); if (i < 0) break; i++; continue; }
    if (ch === '[' || ch === '{') depth++;
    else if (ch === ']' || ch === '}') { depth--; if (depth === 0) { i++; break; } }
  }
  return (new Function('return (' + src.slice(start, i) + ');'))();
}
var VARMAP = { TYPES: 'TYPES', POLARITEITEN: 'POL', BASIS_DEFINITIES: 'BASIS', CENTRA: 'CENTRA', KWADRANTEN: 'KW', doseer: 'DOSEER', regels: 'REGELS' };
function parseApp(src) {
  var D = { missing: [] };
  Object.keys(VARMAP).forEach(function (name) {
    try { D[VARMAP[name]] = extractLiteral(src, name); }
    catch (e) { D.missing.push(name); }
  });
  if (!D.TYPES) throw new Error('TYPES niet gevonden in ' + APP_URL);
  return D;
}
function loadData() {
  return fetch(APP_URL, { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (txt) {
      var D = parseApp(txt);
      lsSet(DATA_KEY, JSON.stringify({ t: Date.now(), D: D }));
      return { D: D, src: 'live' };
    })
    .catch(function (err) {
      var c = lsGet(DATA_KEY);
      if (c) {
        try { var o = JSON.parse(c); if (o && o.D && o.D.TYPES) return { D: o.D, src: 'cache', t: o.t, err: err }; } catch (e) {}
      }
      throw err;
    });
}

/* ============================================================
   Vergelijken van getypte antwoorden
   Hoofdletters en spaties maken niet uit. Accenten wel, tenzij
   de gebruiker dat uitzet.
   ============================================================ */
function normTxt(s) {
  s = String(s == null ? '' : s).toLowerCase().replace(/\s+/g, '');
  if (ST.p.ign && s.normalize) s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
  return s;
}
function acceptSet(q) {
  var a = (q.accept || [q.answer]).slice();
  (q.accept || [q.answer]).forEach(function (x) { var m = /^Type (\d)$/.exec(x); if (m) a.push(m[1]); });
  return a.map(normTxt);
}

/* ============================================================
   Vraaggeneratie uit de data
   ============================================================ */
var MG = [], MGMAP = {};

function build(D) {
  var all = [], ids = {}, skipped = [];
  MG = []; MGMAP = {};
  var T = D.TYPES || [];
  var centrumOf = {};
  (D.CENTRA || []).forEach(function (c) { (c.types || []).forEach(function (n) { centrumOf[n] = c.key; }); });
  T.forEach(function (t) { if (!centrumOf[t.num] && t.cat) centrumOf[t.num] = String(t.cat).replace(/type$/i, ''); });
  function catOf(n) { var t = findBy(T, function (x) { return x.num === n; }); return t ? t.cat : ''; }
  function typeCrumb(n) { return 'Type ' + n + ' (' + catOf(n) + ')'; }
  function fixCentra(o) {
    o.types = o.types || [];
    o.centra = o.centra || [];
    o.types.forEach(function (n) { var c = centrumOf[n]; if (c && o.centra.indexOf(c) < 0) o.centra.push(c); });
  }

  function add(o) {
    o.grp = o.grp || 'std';
    o.accept = (o.accept && o.accept.length) ? o.accept : [o.answer];
    fixCentra(o);
    o.hard = uniq(o.hard, o.accept);
    o.dis = uniq(o.dis, o.accept);
    var nd = uniq(o.hard.concat(o.dis)).length;
    if (o.opts) nd = o.opts.length - 1;
    if (ids[o.id]) return;
    if (o.grp !== 'fill' && nd < (o.binary ? 1 : 2)) { skipped.push({ id: o.id, why: 'te weinig afleiders' }); return; }
    ids[o.id] = 1;
    all.push(o);
  }
  function skip(id, why) { skipped.push({ id: id, why: why }); }

  /* ---------- V-Cirkel ---------- */
  T.forEach(function (t) {
    var others = T.filter(function (x) { return x.num !== t.num; });

    var ok = false;
    (q.types || []).forEach(function (n) { if (p.types.indexOf(n) >= 0) ok = true; });
    (q.centra || []).forEach(function (c) { if (p.centra.indexOf(c) >= 0) ok = true; });

function boxOf(q) { var s = ST.q[q.id]; return s ? s.b : 0; }

}

    out.push(items[i].q);

}

  return h;
}
function nextBtn() { return '<button class="btn" data-act="next">' + (SES.i + 1 >= SES.qs.length ? 'Bekijk resultaat' : 'Volgende vraag') + '</button>'; }
function ftInputs(cur, q, answered) {
  var h = '';
  cur.blanks.forEach(function (f, i) {
    var cls = '';
    if (answered) cls = cur.res[i] ? ' good' : ' bad';
    h += '<div class="irow"><div class="il">' + esc(KWL[f]) + '</div><input class="inp' + cls + '" data-in="' + i + '" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="' + esc(cur.vals[i]) + '"' + (answered ? ' disabled' : '') + '>' +
      (answered && !cur.res[i] ? '<div class="igood">Goed: ' + esc(q.row[f]) + '</div>' : '') + '</div>';
  });
  return h;
}
function sbHtml(cur, answered) {
  var h = '<div class="slots">';
  cur.slots.forEach(function (s, i) {
    var cls = '';
    if (answered) cls = s.ok ? ' good' : ' bad';
    else if (i === cur.active && s.val == null) cls = ' act';
    var val = s.val == null ? '<span class="ph">tik hierna een antwoord</span>' : esc(cur.bank[s.val].t);
    h += '<button class="slot' + cls + '" data-act="slot" data-arg="' + i + '"><span class="sl">' + esc(s.label) + '</span><span class="sv">' + val + '</span>' +
      (answered && !s.ok ? '<span class="igood">Goed: ' + esc(s.ans) + '</span>' : '') + '</button>';
  });
  h += '</div>';
  if (!answered) {
    h += '<div class="bank">';
    cur.bank.forEach(function (w, j) { h += '<button class="bword' + (w.used ? ' used' : '') + '" data-act="bank" data-arg="' + j + '">' + esc(w.t) + '</button>'; });
    h += '</div>';
    var all = cur.slots.every(function (s) { return s.val != null; });
    h += '<button class="btn" id="chk" data-act="check"' + (all ? '' : ' disabled') + '>Controleer</button>';
  }
  return h;
}

function renderQuiz() {
  var q = SES.qs[SES.i], cur = SES.cur, n = SES.qs.length;
  var h = qHead(), b = '<div class="content">';
  if (cur.mode === 'match') {
    b += '<div class="card pad"><div class="qtag">' + esc('Koppelen') + '</div><div class="qtext">' + esc(q.q) + '</div><div class="sub" style="margin-top:6px">Tik op een vakje en kies daarna het antwoord dat erbij hoort.</div></div>';
  } else b += qCard(q, cur);

  if (cur.mode === 'mc') {
    b += '<div class="opts' + (cur.answered ? ' locked' : '') + '">';
    cur.opts.forEach(function (o, i) {
      var cls = '';
      if (cur.answered) {
        if (q.accept.indexOf(o) >= 0) cls = ' good';
        else if (i === cur.chosen) cls = ' bad';
        else cls = ' dim';
      }
      b += '<button class="opt' + cls + '" data-act="pick" data-arg="' + i + '"><span class="olet">' + String.fromCharCode(65 + i) + '</span><span>' + esc(o) + '</span></button>';
    });
    b += '</div>';
    if (cur.answered) {
      var ok = q.accept.indexOf(cur.opts[cur.chosen]) >= 0;
      b += '<div class="fb ' + (ok ? 'good' : 'bad') + '" id="fb"><div class="fh">' + (ok ? 'Goed!' : 'Niet goed') + '</div>';
      b += '<div class="fa">Juiste antwoord: <b>' + esc(answerText(q)) + '</b>' + (ok ? '' : '<br>Jouw keuze: ' + esc(cur.opts[cur.chosen])) + '</div>';
      b += ctxHtml(q, ok ? '' : '<div class="fc">Deze vraag komt vaker terug.</div>') + nextBtn() + '</div>';
    }
  } else if (cur.mode === 'typed') {
    b += '<div class="irow"><input class="inp' + (cur.answered ? (cur.ok ? ' good' : ' bad') : '') + '" data-in="0" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Typ je antwoord" value="' + esc(cur.vals[0]) + '"' + (cur.answered ? ' disabled' : '') + '></div>';
    if (!cur.answered) b += '<button class="btn" id="chk" data-act="check"' + (cur.vals[0].trim() ? '' : ' disabled') + '>Controleer</button><div class="sub center" style="margin-top:8px">Hoofdletters en spaties maken niet uit.</div>';
    else {
      b += '<div class="fb ' + (cur.ok ? 'good' : 'bad') + '" id="fb"><div class="fh">' + (cur.ok ? 'Goed!' : 'Niet goed') + '</div>';
      b += '<div class="fa">Juiste antwoord: <b>' + esc(answerText(q)) + '</b>' + (cur.ok ? '' : '<br>Jouw antwoord: ' + esc(cur.vals[0])) + '</div>';
      b += ctxHtml(q, cur.ok ? '' : '<div class="fc">Deze vraag komt vaker terug, eerst weer in een makkelijkere vorm.</div>') + nextBtn() + '</div>';
    }
  } else if (cur.mode === 'flip') {
    if (!cur.shown) {
      b += '<div class="card pad center"><div class="sub">Bedenk eerst je antwoord, draai dan het kaartje om.</div></div><button class="btn" data-act="reveal">Draai kaartje om</button>';
    } else {
      b += '<div class="fb good" id="fb" style="background:var(--orange-light)"><div class="fh" style="color:var(--orange)">Antwoord</div>';
      if (q.grp === 'fill') {
        b += '<div class="fa">' + ['kk', 'vk', 'al', 'ud'].map(function (f) { return esc(KWL[f]) + ': <b>' + esc(q.row[f]) + '</b>'; }).join('<br>') + '</div>';
      } else b += '<div class="fa"><b>' + esc(answerText(q)) + '</b></div>';
      b += ctxHtml(q) + '<div class="lbl" style="margin-top:12px">Wist je het?</div><div class="two"><button class="btn good2" data-act="self" data-arg="1">Wist ik</button><button class="btn bad2" data-act="self" data-arg="0">Wist ik niet</button></div></div>';
    }
  } else if (cur.mode === 'ft') {
    b += ftInputs(cur, q, cur.answered);
    if (!cur.answered) {
      b += '<button class="btn" id="chk" data-act="check"' + (cur.vals.every(function (v) { return v.trim(); }) ? '' : ' disabled') + '>Controleer</button><div class="sub center" style="margin-top:8px">Hoofdletters en spaties maken niet uit.</div>';
    } else {
      var okk = cur.res.every(Boolean), nk = cur.res.filter(Boolean).length;
      b += '<div class="fb ' + (okk ? 'good' : 'bad') + '" id="fb"><div class="fh">' + (okk ? 'Goed!' : nk + ' van ' + cur.res.length + ' goed') + '</div>';
      b += ctxHtml(q, okk ? '' : '<div class="fc">Dit kernkwadrant komt vaker terug.</div>') + nextBtn() + '</div>';
    }
  } else if (cur.mode === 'sb' || cur.mode === 'match') {
    b += sbHtml(cur, cur.answered);
    if (cur.answered) {
      var okc = cur.slots.filter(function (s) { return s.ok; }).length, tot = cur.slots.length;
      b += '<div class="fb ' + (okc === tot ? 'good' : 'bad') + '" id="fb"><div class="fh">' + (okc === tot ? 'Goed!' : okc + ' van ' + tot + ' goed') + '</div>';
      if (cur.mode === 'match') {
        b += '<div class="fa">' + cur.pairs.map(function (pr) { return esc(pr.l) + ' hoort bij <b>' + esc(pr.r) + '</b>'; }).join('<br>') + '</div>';
        b += '<div class="fc"><b>' + esc(MGMAP[q.gid].crumb) + '</b></div>';
      } else b += ctxHtml(q);
      if (okc !== tot) b += '<div class="fc">Wat fout ging komt vaker terug.</div>';
      b += nextBtn() + '</div>';
    }
  }
  b += '</div>';
  app.innerHTML = h + b;
  if (cur.answered || (cur.mode === 'flip' && cur.shown)) { var f = document.getElementById('fb'); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  if ((cur.mode === 'typed' || cur.mode === 'ft') && !cur.answered) {
    var inp = app.querySelector('.inp');
    if (inp && inp.focus) { try { inp.focus(); } catch (e) {} }
  }
}

function renderEnd() {
  var n = SES.res.length, good = SES.res.filter(function (r) { return r.ok; }).length;
  var missed = SES.res.filter(function (r) { return !r.ok; });
  var b = '<div class="content"><div class="card pad center"><div class="sub">Resultaat</div><div class="big">' + good + ' / ' + n + '</div><div class="sub">' + (n ? pct(good / n) : 0) + '% goed</div></div>';
  if (missed.length) {
    b += '<div class="card pad"><div class="sec-title">Gemist (' + missed.length + ')</div>';
    missed.forEach(function (r) {
      var qt = r.q.grp === 'match' ? r.q.q : (r.q.q + (r.q.quote ? ' ' + r.q.quote : '') + (r.q.grp === 'fill' ? ' (' + r.q.row[r.given] + ')' : ''));
      var at = r.q.grp === 'match' ? r.pairs.map(function (pr) { return pr.l + ' = ' + pr.r; }).join(' · ') : answerText(r.q);
      b += '<div class="miss"><div class="mq">' + esc(qt) + '</div><div class="ma">' + esc(at) + '</div></div>';
    });
    b += '</div>';
    b += '<button class="btn" data-act="again">Oefen de gemiste vragen opnieuw</button>';
  }
  b += '<button class="btn ' + (missed.length ? 'line' : '') + '" data-act="more">Nog een ronde met dezelfde selectie</button>';
  b += '<button class="btn sec" data-act="dash">Terug naar dashboard</button></div>';
  app.innerHTML = header('Sessie klaar') + b;
}

function renderLoadErr() {
  var msg = loadErr && loadErr.message ? loadErr.message : 'onbekende fout';
  app.innerHTML = header('Overhoren op de stof uit de app') +
    '<div class="content"><div class="card pad"><div class="sec-title">De stof kon niet geladen worden</div>' +
    '<p class="sub" style="margin-top:6px;font-size:13px;line-height:1.5">Deze pagina leest de stof uit <b>' + APP_URL + '</b>. Zorg dat toets.html in dezelfde map staat en open de pagina via https (bijvoorbeeld GitHub Pages), niet als los bestand.<br><br>Melding: ' + esc(msg) + '</p>' +
    '<button class="btn" data-act="retry">Opnieuw proberen</button></div></div>';
}

function render(top) {
  if (view === 'dash') renderDash();
  else if (view === 'quiz') renderQuiz();
  else if (view === 'end') renderEnd();
  else if (view === 'err') renderLoadErr();
  if (top) window.scrollTo(0, 0);
}

/* ============================================================
   Acties
   ============================================================ */
function setPref(k, v) { ST.p[k] = v; saveState(); }
function finish(it, ok, extra) {
  var cur = SES.cur;
  cur.answered = true;
  var r = { q: it, ok: ok };
  if (extra) for (var k in extra) r[k] = extra[k];
  SES.res.push(r);
}
function advance() {
  if (SES.i + 1 >= SES.qs.length) { view = 'end'; render(true); }
  else { SES.i++; SES.cur = prepare(SES.qs[SES.i]); render(true); }
}
function refreshCheck() {
  var btn = document.getElementById('chk');
  if (!btn || !SES) return;
  var cur = SES.cur, ok = false;
  if (cur.mode === 'typed') ok = !!cur.vals[0].trim();
  else if (cur.mode === 'ft') ok = cur.vals.every(function (v) { return v.trim(); });
  btn.disabled = !ok;
}
function doCheck() {
  var cur = SES.cur, it = SES.qs[SES.i], ok;
  if (cur.answered) return;
  if (cur.mode === 'typed') {
    if (!cur.vals[0].trim()) return;
    ok = acceptSet(it).indexOf(normTxt(cur.vals[0])) >= 0;
    cur.ok = ok; record(it, ok); finish(it, ok);
  } else if (cur.mode === 'ft') {
    if (!cur.vals.every(function (v) { return v.trim(); })) return;
    cur.res = cur.blanks.map(function (f, i) { return normTxt(cur.vals[i]) === normTxt(it.row[f]); });
    ok = cur.res.every(Boolean); record(it, ok); finish(it, ok, { given: cur.given });
  } else if (cur.mode === 'sb' || cur.mode === 'match') {
    if (!cur.slots.every(function (s) { return s.val != null; })) return;
    cur.slots.forEach(function (s) { s.ok = normTxt(cur.bank[s.val].t) === normTxt(s.ans); });
    ok = cur.slots.every(function (s) { return s.ok; });
    if (cur.mode === 'match') { cur.pairs.forEach(function (pr, i) { record(pr, cur.slots[i].ok); }); finish(it, ok, { pairs: cur.pairs }); }
    else { record(it, ok); finish(it, ok, { given: cur.given }); }
  }
  render();
}
app.addEventListener('click', function (e) {
  var t = e.target;
  while (t && t !== app && !(t.getAttribute && t.getAttribute('data-act'))) t = t.parentNode;
  if (!t || t === app) return;
  var act = t.getAttribute('data-act'), arg = t.getAttribute('data-arg');
  var p = ST.p;
  if (act === 'weak') { setPref('weak', !!t.checked); return; }
  if (act === 'ign') { setPref('ign', !!t.checked); return; }
  if (act === 'tab') { toggleIn(p.tabs, arg); saveState(); render(); }
  else if (act === 'clrtab') { p.tabs = []; saveState(); render(); }
  else if (act === 'cen') { toggleIn(p.centra, arg); saveState(); render(); if (t.className.indexOf('tile') >= 0) window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (act === 'clrcen') { p.centra = []; saveState(); render(); }
  else if (act === 'typ') { toggleIn(p.types, Number(arg)); saveState(); render(); if (t.className.indexOf('tile') >= 0) window.scrollTo({ top: 0, behavior: 'smooth' }); }
  else if (act === 'clrtyp') { p.types = []; saveState(); render(); }
  else if (act === 'knd') { toggleIn(p.kinds, arg); saveState(); render(); }
  else if (act === 'clrknd') { p.kinds = []; saveState(); render(); }
  else if (act === 'form') { setPref('form', arg); render(); }
  else if (act === 'n') { setPref('n', Number(arg)); render(); }
  else if (act === 'start') startFromPrefs();
  else if (act === 'weakgo') {
    var g = WEAKG[Number(arg)];
    if (g) { p.tabs = [g.tab]; p.types = g.t != null ? [g.t] : []; p.centra = g.c != null ? [g.c] : []; p.kinds = []; p.weak = false; saveState(); startFromPrefs(); }
  }
  else if (act === 'pick') {
    var cur = SES.cur;
    if (cur.answered) return;
    var q = SES.qs[SES.i], idx = Number(arg), ok = q.accept.indexOf(cur.opts[idx]) >= 0;
    cur.chosen = idx;
    record(q, ok); finish(q, ok);
    render();
  }
  else if (act === 'check') doCheck();
  else if (act === 'reveal') { SES.cur.shown = true; render(); }
  else if (act === 'self') {
    var c2 = SES.cur, q2 = SES.qs[SES.i], ok2 = arg === '1';
    if (c2.answered) return;
    record(q2, ok2); finish(q2, ok2, { given: c2.given });
    advance();
  }
  else if (act === 'slot') {
    var c3 = SES.cur, i3 = Number(arg);
    if (c3.answered) return;
    var s3 = c3.slots[i3];
    if (s3.val != null) { c3.bank[s3.val].used = false; s3.val = null; }
    c3.active = i3;
    render();
  }
  else if (act === 'bank') {
    var c4 = SES.cur, j = Number(arg);
    if (c4.answered || c4.bank[j].used) return;
    var tgt = c4.slots[c4.active] && c4.slots[c4.active].val == null ? c4.active : -1;
    if (tgt < 0) for (var k = 0; k < c4.slots.length; k++) if (c4.slots[k].val == null) { tgt = k; break; }
    if (tgt < 0) return;
    c4.slots[tgt].val = j; c4.bank[j].used = true;
    var nx = -1;
    for (var m = 0; m < c4.slots.length; m++) if (c4.slots[m].val == null) { nx = m; break; }
    c4.active = nx < 0 ? tgt : nx;
    render();
  }
  else if (act === 'next') advance();
  else if (act === 'quit') {
    view = SES.res.length ? 'end' : 'dash';
    render(true);
  }
  else if (act === 'again') {
    var redo = [], seen = {};
    SES.res.filter(function (r) { return !r.ok; }).forEach(function (r) { if (!seen[r.q.id]) { seen[r.q.id] = 1; redo.push(r.q); } });
    startSession(shuffle(redo));
  }
  else if (act === 'more') startFromPrefs();
  else if (act === 'dash') { view = 'dash'; render(true); }
  else if (act === 'reset') {
    if (window.confirm('Alle scores en voortgang wissen? Dit kan niet ongedaan gemaakt worden.')) {
      var keepP = ST.p;
      ST = freshState(); ST.p = keepP;
      lsDel(STORE_KEY); saveState();
      render(true);
    }
  }
  else if (act === 'retry') init();
});
app.addEventListener('input', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute || t.getAttribute('data-in') == null || !SES || !SES.cur || !SES.cur.vals) return;
  SES.cur.vals[Number(t.getAttribute('data-in'))] = t.value;
  refreshCheck();
});
app.addEventListener('keydown', function (e) {
  var t = e.target;
  if (e.key !== 'Enter' || !t || !t.getAttribute || t.getAttribute('data-in') == null || !SES) return;
  e.preventDefault();
  var idx = Number(t.getAttribute('data-in')), inputs = app.querySelectorAll('.inp');
  if (idx + 1 < inputs.length) { inputs[idx + 1].focus(); return; }
  doCheck();
});

/* ============================================================
   Start
   ============================================================ */
function init() {
  view = 'load';
  loadState();
  loadData().then(function (res) {
    DATA = res.D; SRC = res;
    var g = build(DATA);
    ALL = g.all; SKIPPED = g.skipped;
    NOTES = dataChecks(DATA, SKIPPED);
    if (!ALL.length) throw new Error('Er konden geen vragen uit de data gemaakt worden.');
    view = 'dash';
    render(true);
  }).catch(function (err) {
    loadErr = err; view = 'err'; render(true);
  });
}
init();

})();
</script>
</body>
</html>
