<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="V-Cirkel">
<title>V-Cirkel Academie</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --orange: #C8651A;
  --orange-light: #F5E8D8;
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --surface2: #F4F2EE;
  --text: #1A1A18;
  --text2: #5A5A54;
  --text3: #9A9A90;
  --border: rgba(0,0,0,0.10);
  --radius: 12px;
  --tab-h: 68px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; color: var(--text); overflow: hidden; }
.screen { display: none; position: absolute; inset: 0; bottom: calc(var(--tab-h) + var(--safe-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.screen.active { display: block; }
.header { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 16px 20px 12px; position: sticky; top: 0; z-index: 10; }
.header h1 { font-size: 20px; font-weight: 600; }
.header p { font-size: 13px; color: var(--text2); margin-top: 2px; }
.header-logo { display: flex; align-items: center; gap: 10px; }
.logo-dot { width: 28px; height: 28px; background: var(--orange); border-radius: 50%; flex-shrink: 0; }
.type-selector { padding: 12px 16px; display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--surface); border-bottom: 0.5px solid var(--border); position: sticky; top: 61px; z-index: 9; scrollbar-width: none; }
.type-selector::-webkit-scrollbar { display: none; }
.type-btn { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 500; color: var(--text2); cursor: pointer; }
.type-btn.active { background: var(--orange); border-color: var(--orange); color: white; }
.pfbtn { flex-shrink: 0; padding: 5px 12px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 500; color: var(--text2); cursor: pointer; white-space: nowrap; }
.pfbtn.pfactive { background: var(--orange); border-color: var(--orange); color: white; }
.content { padding: 16px; }
.card { background: var(--surface); border-radius: var(--radius); border: 0.5px solid var(--border); margin-bottom: 12px; overflow: hidden; }
.card-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.card-body { padding: 0 16px 14px; display: none; }
.card-body.open { display: block; }
.section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); margin-bottom: 6px; margin-top: 14px; }
.section-label:first-child { margin-top: 0; }
.bullet-list { list-style: none; }
.bullet-list li { font-size: 14px; color: var(--text2); line-height: 1.5; padding: 3px 0 3px 14px; position: relative; }
.bullet-list li::before { content: "·"; position: absolute; left: 0; color: var(--orange); font-weight: bold; font-size: 16px; line-height: 1.3; }
.strategy-box { background: var(--orange-light); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.strategy-box .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--orange); margin-bottom: 4px; }
.strategy-box p { font-size: 13px; color: var(--text); line-height: 1.5; font-style: italic; }
.polarity-row { display: flex; gap: 8px; margin-bottom: 8px; }
.polarity-cell { flex: 1; background: var(--surface2); border-radius: 8px; padding: 10px 12px; }
.polarity-cell .plabel { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); margin-bottom: 4px; }
.polarity-cell .pval { font-size: 14px; font-weight: 600; color: var(--text); }
.polarity-cell.kern { background: var(--orange-light); }
.polarity-cell.kern .plabel { color: var(--orange); }
.polarity-cell.kern .pval { color: var(--orange); }
.filter-tabs { display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; background: var(--surface); border-bottom: 0.5px solid var(--border); position: sticky; top: 61px; z-index: 9; }
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-tab { flex-shrink: 0; padding: 5px 12px; border-radius: 16px; border: 1px solid var(--border); font-size: 12px; font-weight: 500; color: var(--text2); cursor: pointer; background: var(--surface); }
.filter-tab.active { background: var(--orange); border-color: var(--orange); color: white; }
.ft-v.active { background: #A03010; border-color: #A03010; }
.ft-l.active { background: #8A5A00; border-color: #8A5A00; }
.ft-m.active { background: #1A5A1A; border-color: #1A5A1A; }
.ft-d.active { background: #1A3A7A; border-color: #1A3A7A; }
.search-box { margin: 12px 16px 0; }
.search-box input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; color: var(--text); outline: none; }
.search-box input:focus { border-color: var(--orange); }
.pol-badge { display: inline-block; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 600; margin: 2px; background: var(--surface2); color: var(--text2); }
.pol-badge.kern { background: var(--orange-light); color: var(--orange); }
.def-modal { display: none; position: fixed; inset: 0; z-index: 100; }
.def-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
.def-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 16px 16px 0 0; padding: 20px 20px calc(20px + var(--safe-bottom)); max-height: 75vh; overflow-y: auto; }
.def-sheet h3 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.def-subtitle { font-size: 13px; color: var(--text3); margin-bottom: 14px; }
.def-close { position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: var(--surface2); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; color: var(--text2); border: none; }
.def-table { width: 100%; border-collapse: collapse; }
.def-table td { padding: 8px 0; font-size: 13px; vertical-align: top; border-bottom: 0.5px solid var(--border); }
.def-table td:first-child { color: var(--text2); width: 48%; padding-right: 8px; }
.def-table .col-head { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); padding: 4px 0 8px; }
.def-table tr:last-child td { border-bottom: none; }
.kw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kw-cell { background: var(--surface2); border-radius: 8px; padding: 10px 12px; }
.kw-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.kw-kk { color: #1A5A1A; }
.kw-vk { color: #A03010; }
.kw-ud { color: #1A3A7A; }
.kw-al { color: #8A5A00; }
.kw-item { font-size: 13px; color: var(--text2); }
.coach-section { margin-bottom: 16px; }
.coach-section h3 { font-size: 13px; font-weight: 700; color: var(--surface); background: var(--orange); margin-bottom: 12px; padding: 8px 14px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.05em; border: none; }
.coach-item { margin-bottom: 10px; padding: 12px 14px; background: var(--surface); border-radius: 10px; border: 0.5px solid var(--border); }
.ci-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
.ci-num { width: 22px; height: 22px; border-radius: 50%; background: var(--orange); color: white; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ci-title { font-size: 14px; font-weight: 600; color: var(--text); }
.ci-body { font-size: 13px; color: var(--text2); line-height: 1.5; }
.doseer-item { padding: 12px 14px; background: var(--surface); border-radius: 10px; border: 0.5px solid var(--border); margin-bottom: 8px; }
.doseer-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.doseer-letter { width: 26px; height: 26px; background: var(--orange); color: white; border-radius: 6px; font-size: 13px; font-weight: 700; text-align: center; line-height: 26px; flex-shrink: 0; }
.doseer-title { font-size: 14px; font-weight: 600; color: var(--text); }
.doseer-body { font-size: 13px; color: var(--text2); line-height: 1.5; }
.tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 0.5px solid var(--border); display: flex; padding-bottom: var(--safe-bottom); z-index: 50; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 4px; cursor: pointer; border: none; background: none; color: var(--text3); }
.tab-item.active { color: var(--orange); }
.tab-icon { font-size: 20px; margin-bottom: 3px; }
.tab-label { font-size: 10px; font-weight: 500; }
.group-header { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); padding: 16px 16px 8px; }
.empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }
.chevron { transition: transform 0.2s; font-size: 12px; color: var(--text3); }
.chevron.open { transform: rotate(180deg); }
</style>
</head>
<body>

<div class="screen active" id="screen-vcirkel">
  <div class="header">
    <div class="header-logo">
      <div class="logo-dot"></div>
      <div><h1>V-Cirkel</h1><p>Drijfveren per type</p></div>
    </div>
  </div>
  <div class="filter-tabs" id="vcirkel-filter">
    <div class="filter-tab active" onclick="setVFilter(this,'all')">Alle V's</div>
    <div class="filter-tab ft-v" onclick="setVFilter(this,'verslaving')">Verslaving</div>
    <div class="filter-tab ft-l" onclick="setVFilter(this,'verleiding')">Verleiding</div>
    <div class="filter-tab ft-m" onclick="setVFilter(this,'vermijding')">Vermijding</div>
    <div class="filter-tab ft-d" onclick="setVFilter(this,'verdediging')">Verdediging</div>
  </div>
  <div class="content" id="vcirkel-content"></div>
</div>

<div class="screen" id="screen-polariteiten">
  <div class="header">
    <div class="header-logo">
      <div class="logo-dot"></div>
      <div><h1>Polariteiten</h1><p>Per type of per polariteit</p></div>
    </div>
  </div>
  <div class="filter-tabs" id="pol-tabs">
    <div class="filter-tab active" onclick="setPolarView(this,'type')">Per type</div>
    <div class="filter-tab" onclick="setPolarView(this,'polariteit')">Per polariteit</div>
  </div>
  <div id="pol-type-filter-wrap" style="display:none;background:var(--surface);border-bottom:0.5px solid var(--border);position:sticky;top:109px;z-index:8">
    <div id="pol-type-filter"></div>
  </div>
  <div class="content" id="pol-content"></div>
</div>

<div class="screen" id="screen-kwadranten">
  <div class="header">
    <div class="header-logo">
      <div class="logo-dot"></div>
      <div><h1>Kernkwadranten</h1><p>Kwaliteiten, valkuilen, uitdagingen</p></div>
    </div>
  </div>
  <div class="type-selector" id="kw-type-selector"></div>
  <div class="content" id="kw-content"></div>
</div>

<div class="screen" id="screen-coaching">
  <div class="header">
    <div class="header-logo">
      <div class="logo-dot"></div>
      <div><h1>Coaching</h1><p>DOSEER &amp; 10 regels</p></div>
    </div>
  </div>
  <div class="content" id="coaching-content"></div>
</div>

<div class="def-modal" id="def-modal">
  <div class="def-backdrop" onclick="closeModal()"></div>
  <div class="def-sheet" id="def-sheet">
    <button class="def-close" onclick="closeModal()">x</button>
    <h3 id="def-title"></h3>
    <p class="def-subtitle">Kernpolariteit - herkenningspunten</p>
    <div id="def-body"></div>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-item active" onclick="goTab('vcirkel',this)">
    <span class="tab-icon">&#9711;</span><span class="tab-label">V-Cirkel</span>
  </button>
  <button class="tab-item" onclick="goTab('polariteiten',this)">
    <span class="tab-icon">&#8644;</span><span class="tab-label">Polariteiten</span>
  </button>
  <button class="tab-item" onclick="goTab('kwadranten',this)">
    <span class="tab-icon">&#8862;</span><span class="tab-label">Kwadranten</span>
  </button>
  <button class="tab-item" onclick="goTab('coaching',this)">
    <span class="tab-icon">&#10039;</span><span class="tab-label">Coaching</span>
  </button>
</div>

<script>
var TYPES = [
  { num:1, cat:'Buiktype', strategie:'Als ik 24/7 het juiste doe en mijn eigen strenge normen naleef, ben ik perfect en hoef ik mijn eigen imperfectie niet onder ogen te komen.',
    verslaving:{ naam:'Woede', zin:'Als de realiteit afwijkt van jouw norm, dan is dat irritant en moet je daar wat aan doen.', bullets:['Vooral over de eigen imperfectie maar ook over de imperfectie in het algemeen','Herkent zijn eigen woede vaak niet, herkent irritatie meestal wel','Registreert onmiddellijk wat ontbreekt/beter had gekund: verongelijkheid','Het is de motor om zichzelf en anderen te verbeteren','Leidt tot: streven naar perfectie, vermijden van imperfectie en reactieformatie'] },
    verleiding:{ naam:'Perfectie', zin:'Als je je eigen norm haalt, dan doe je het juiste.', bullets:['Pro actief: de eigen norm is leidend','Het juiste willen doen = de eigen normen halen','Voelt zich hiervoor verantwoordelijk: de norm MOET gehaald worden (veel moeten!)','Het kan altijd beter / is erg kritisch (op zichzelf en anderen)','Neemt veel op zijn bord omdat het dan tenminste op zijn manier gebeurd','Lat ligt erg te hoog: zodat hij contact houdt met zijn eigen imperfectie'] },
    vermijding:{ naam:'Imperfectie', zin:'Als je kritisch blijft, dan doe je het goed / vermijd je fouten.', bullets:['Als de norm niet gehaald wordt ervaart type 1 imperfectie','Focus ligt op fouten/wat er ontbreekt/afwijkt van zijn lat','Corrigeert zichzelf en anderen zodat de norm wordt gehaald','Sterke interne criticus/maakt overuren','Irriteert zich snel aan zichzelf en anderen en irriteert zich daar ook weer aan','Dit leidt tot reactieformatie'] },
    verdediging:{ naam:'Reactieformatie', zin:'Als je je ergert, dan moet je altijd beheerst blijven.', bullets:['Beheersing is een gedeelde norm van type 1','Iedere primaire reactie gaat langs het normenbureau','Woede wordt beheerst of getransformeerd tot keurige/aangepaste reactie','Door beheersing loopt emmer met irritaties soms over: leidt tot woede uitbarsting','Woede over de eigen woede'] }
  },
  { num:2, cat:'Harttype', strategie:'Als ik 24/7 bijdraag aan het geluk van anderen, dan ben ik nodig en verdien ik de liefde van anderen. Dan sta ik nooit met lege handen en schiet ik nooit tekort.',
    verslaving:{ naam:'Trots', zin:'Als je een tekort signaleert, dan moet je iets toevoegen.', bullets:['Het besef dat je iets bij te dragen hebt/het verschil kan maken','De ander heeft meer nodig dan jij (alsof jij erboven staat/zelf niets nodig hebt)','Leidt vaak tot verticale relaties: de Twee geeft, de ander ontvangt','Motor om veel te willen betekenen voor anderen','Leidt tot: nodig willen zijn voor anderen, eigen behoeftigheid onderdrukken'] },
    verleiding:{ naam:'Nodig zijn', zin:'Als je het verschil maakt in de levens van anderen, dan verdien je waardering en liefde.', bullets:['Wil graag het verschil maken in het leven van anderen','Heeft het nodig om nodig te zijn: zo verdient hij de liefde en erkenning van anderen','Tekorten in levens van anderen moeten worden gevuld','Attent op behoeften van belangrijke anderen/soms opdringerig','Voelt feilloos aan wat anderen nodig hebben en speelt daarop in/raakt uitgeput'] },
    vermijding:{ naam:'Behoeftigheid', zin:'Als je iets nodig hebt van een ander, dan sta je in de schuld en schiet je tekort.', bullets:['Angst dat je met lege handen blijft staan als je vraagt','Herkent slecht wat hij nodig heeft/voelt dit pas later (vaak als hij alleen is)','Wil voorkomen dat hij iets nodig heeft van anderen/in de schuld staat','Vragen is lastig: hoopt dat anderen aanvoelen wat hij nodig heeft'] },
    verdediging:{ naam:'Onderdrukken', zin:'Als je je eigen verlangens onderdrukt, dan kun je meer betekenen voor anderen.', bullets:['Van eigen verlangens en behoeftigheid: ik ben nodig, maar heb niets nodig','Te lang onderdrukken leidt tot wrok: de omgeving wordt aangeklaagd','Martelaar: kijk mij nou eens klaar staan voor anderen en wie is er voor mij?','Ook eigen wil wordt vaak onderdrukt: wat anderen willen is belangrijker'] }
  },
  { num:3, cat:'Harttype', strategie:'Als ik 24/7 presteer en mij richt op de maakbare wereld, dan bereik ik mijn doelen en ben ik succesvol. Dan hoef ik mijn eigen falen niet te ervaren.',
    verslaving:{ naam:'Bedrog', zin:'Als je iets wilt, dan kun je dat ook bereiken.', bullets:['Alles is maakbaar, als je je maar inspant','Willen is kunnen','Richt zich op de maakbare wereld: de buitenwereld','Maskeert negatieve gevoelens, die leveren niets op','Motor om veel te presteren'] },
    verleiding:{ naam:'Succes', zin:'Als je haalbare doelen stelt, dan ben je succesvol en kan je veel vinkjes zetten.', bullets:['Wil het goed doen in ogen van anderen (imago)','Zoveel mogelijk vinkjes zetten/tempo ligt hoog. Succes = Doelen halen','Veel doen, veel presteren: hoe meer je doet, hoe meer je bent','Geniet vaak maar kort van zijn succes: is alweer op weg naar volgend doel'] },
    vermijding:{ naam:'Falen', zin:'Als je je doel bijstelt, dan heb je succes.', bullets:['Als hij zijn doelen niet haalt en/of zijn imago schade oploopt','Ziet falen als leerervaring/nuttige feedback','Stelt doelen bij als hij falen ziet aankomen','Geeft het een draai, zodat het toch nog een succes lijkt'] },
    verdediging:{ naam:'Identificatie', zin:'Als je je identificeert met je succes, anderen of je omgeving, dan bereik je sneller je doelen.', bullets:['Identificeert zich onmiddellijk met zijn succes als falen dreigt','Scant voortdurend welk gedrag hem het meest oplevert','Identificeert zich (kleurt mee) met zijn omgeving: kameleongedrag','Eigen identiteit is slecht ontwikkeld'] }
  },
  { num:4, cat:'Harttype', strategie:'Als ik 24/7 leef vanuit mijn gevoel en authentiek ben, dan ben ik echt mezelf. Dan hoef ik mij niet te verbinden met anderen en word ik niet afgewezen.',
    verslaving:{ naam:'Afgunst', zin:'Als je jezelf vergelijkt met anderen, dan voel je dat er aan jou iets ontbreekt.', bullets:['Het gevoel dat er aan jou iets ontbreekt, dat anderen wel lijken te hebben','Vergelijkt zichzelf negatief met anderen','Verlangt naar verbinding, maar verbinding is tevens onveilig','Motor om vooral zichzelf en authentiek te zijn'] },
    verleiding:{ naam:'Echtheid', zin:'Als je echt jezelf bent en vanuit je gevoel leeft, dan ben je echt.', bullets:['Wil echt zijn, zichzelf zijn','Het enige dat je onderscheidt van anderen is je gevoel/maakt je uniek','Gevoel wordt geintensiveerd: ik ben wat ik voel','Hoe meer je voelt, hoe meer en echter je bent','Neiging tot dramatiseren, uitvergroten van gevoel'] },
    vermijding:{ naam:'Alledaagsheid', zin:'Als je net zo bent als anderen, dan word je afgewezen.', bullets:['Net zo zijn als anderen wordt vermeden: ik ben uniek en niet alledaags','Bang om door de mand te vallen als je wordt gemeten zoals anderen','Sleur is gevaarlijk: want niet intens, dus niet echt','Wil geen grijze muis zijn/blijft ongrijpbaar'] },
    verdediging:{ naam:'Onderscheiden', zin:'Als je je onderscheid, dan gelden voor jou andere regels.', bullets:['In de verbinding ben je onveilig: dan kun je afgewezen worden','Onderscheiden van anderen is veilig, maakt dat voor jou andere regels gelden','Aansluiten en meegaan met de rest voelt tegennatuurlijk/onecht','Begrijpt andere mensen vaak niet en voelt zich ook onbegrepen'] }
  },
  { num:5, cat:'Hoofdtype', strategie:'Als ik mij 24/7 richt op de objectieve wereld en te allen tijde redelijk blijf, dan word ik niet afhankelijk van de subjectieve en emotionele wereld.',
    verslaving:{ naam:'Hebzucht', zin:'Als je voldoende van alles hebt, dan kun je jezelf redden in dit leven.', bullets:['Alles wat je nodig hebt om self supporting te zijn wordt vergaard','Alert op verspilling van ruimte, tijd, geld en emoties/legt voorraadjes aan','Motor om onafhankelijk te zijn en zich te richten op de objectieve wereld','Leidt tot: het verzamelen van kennis, vermijden van afhankelijkheid en terugtrekken'] },
    verleiding:{ naam:'Kennis', zin:'Als je begrijpt hoe het werkt, dan kun je onafhankelijk blijven.', bullets:['Heeft honger naar kennis/feiten/objectieve informatie','Wil begrijpen hoe de dingen werken: dan kun je je altijd zelf redden','Richt zich op de waarneembare wereld: waar dingen meetbaar zijn','Kan zijn mening altijd onderbouwen met feiten'] },
    vermijding:{ naam:'Afhankelijkheid', zin:'Als je onafhankelijk wilt zijn, dan moet je emoties en subjectiviteit vermijden.', bullets:['Wil niet afhankelijk zijn van subjectiviteit/emoties','Eigen emoties en die van anderen worden vermeden','Houdt niet van vragen: lost liever zelf alles op','Observeert liever dan dat hij deelneemt: mensen zijn emotie voor hem'] },
    verdediging:{ naam:'Terugtrekken', zin:'Als je wilt opladen, dan moet je je terug trekken.', bullets:['De Vijf raakt snel overprikkeld: neemt alle info op/maakt geen onderscheid','Trekt zich regelmatig terug om de boel even op een rijtje te zetten','Kan aanwezig-afwezig zijn/trekt zich terug in zijn hoofd/bewaart zo afstand'] }
  },
  { num:6, cat:'Hoofdtype', strategie:'Als ik 24/7 zorg dat ik inspeel op de verwachtingen van anderen en loyaal ben, dan ben ik minder onzeker en hoef ik niet op mezelf te vertrouwen.',

  9:[ {kk:'Bescheiden',vk:'Onzichtbaar',al:'Arrogant',ud:'Profileren'},{kk:'Rustig',vk:'Onbeweeglijk',al:'Onrustig',ud:'Bewegen'},{kk:'Relaxt',vk:'Verdoofd',al:'Gestrest',ud:'Wakker blijven'},{kk:'Sfeer bewaken',vk:'Afvlakken',al:'Confrontatie',ud:'Benoemen'},{kk:'Tolerant',vk:'Meningloos',al:'Intolerant',ud:'Mening delen'},{kk:'Relativeren',vk:'Onbelangrijk maken',al:'Overdrijven',ud:'Belangrijk maken'} ]
};

var vFilter = 'all';
var polView = 'type';
var polTypeFilter = 0;
var kwType = 1;

function goTab(name, el) {
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
}

function setVFilter(el, f) {
  vFilter = f;
  document.querySelectorAll('#vcirkel-filter .filter-tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  renderVCirkel();
}

function renderVCirkel() {
  var cont = document.getElementById('vcirkel-content');
  var cats = {'Buiktype':[8,9,1],'Harttype':[2,3,4],'Hoofdtype':[5,6,7]};
  var vkeys = vFilter==='all' ? ['verslaving','verleiding','vermijding','verdediging'] : [vFilter];
  var vnames = {verslaving:'Verslaving',verleiding:'Verleiding',vermijding:'Vermijding',verdediging:'Verdediging'};
  var html = '';
  Object.keys(cats).forEach(function(cat){
    html += '<div class="group-header">'+cat+'</div>';
    cats[cat].forEach(function(n){
      var t = TYPES.find(function(x){return x.num===n;});
      html += '<div class="card"><div class="card-header" onclick="toggleCard(\'vc\','+n+')">';
      html += '<div><div style="font-size:15px;font-weight:600">Type '+n+'</div>';
      if(vFilter!=='all') html += '<div style="font-size:12px;color:var(--text2);margin-top:2px">'+t[vFilter].naam+'</div>';
      html += '</div><span class="chevron" id="vc-ch-'+n+'">&#9662;</span></div>';
      html += '<div class="card-body" id="vc-b-'+n+'">';
      html += '<div class="strategy-box"><div class="label">Overlevingsstrategie</div><p>'+t.strategie+'</p></div>';
      vkeys.forEach(function(key,ki){
        var v = t[key];
        html += '<div class="section-label">'+vnames[key]+': <strong style="color:var(--text)">'+v.naam+'</strong></div>';
        html += '<p style="font-size:13px;font-style:italic;color:var(--text2);margin-bottom:8px;line-height:1.5">'+v.zin+'</p>';
        html += '<ul class="bullet-list">';
        v.bullets.forEach(function(b){html += '<li>'+b+'</li>';});
        html += '</ul>';
        if(ki < vkeys.length-1) html += '<div style="height:10px"></div>';
      });
      html += '</div></div>';
    });
  });
  cont.innerHTML = html;
}

function toggleCard(prefix, n) {
  var body = document.getElementById(prefix+'-b-'+n);
  var chev = document.getElementById(prefix+'-ch-'+n);
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

var polTypeFilter = 0; // 0 = all

function setPolarView(el, view) {
  polView = view;
  document.querySelectorAll('#pol-tabs .filter-tab').forEach(function(t){t.classList.remove('active');});
  el.classList.add('active');
  var tfWrap = document.getElementById('pol-type-filter-wrap');
  if(view === 'polariteit') {
    tfWrap.style.display = 'block';
    buildPolTypeFilter();
  } else {
    tfWrap.style.display = 'none';
  }
  renderPolariteiten();
}

function buildPolTypeFilter() {
  var bar = document.getElementById('pol-type-filter');
  var rows = '';

  // Row 1: type filter
  rows += '<div style="display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch">';
  var allActive = (polTypeFilter===0 && !polBasisFilter);
  rows += '<div class="pfbtn'+(allActive?' pfactive':'')+'" data-type="0" data-basis="">Alles</div>';
  TYPES.forEach(function(t){
    var active = (polTypeFilter===t.num && !polBasisFilter);
    rows += '<div class="pfbtn'+(active?' pfactive':'')+'" data-type="'+t.num+'" data-basis="">Type '+t.num+'</div>';
  });
  rows += '</div>';

  // Row 2: basis polariteit filter
  rows += '<div style="display:flex;gap:6px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch">';
  BASIS_ORDER.forEach(function(b){
    var active = (polBasisFilter===b);
    rows += '<div class="pfbtn'+(active?' pfactive':'')+'" data-type="0" data-basis="'+b+'">'+b+'</div>';
  });
  rows += '</div>';

  bar.innerHTML = rows;

  bar.querySelectorAll('.pfbtn').forEach(function(el){
    el.addEventListener('click', function(){
      var t = parseInt(this.getAttribute('data-type')) || 0;
      var b = this.getAttribute('data-basis') || null;
      polTypeFilter = t;
      polBasisFilter = b || null;
      bar.querySelectorAll('.pfbtn').forEach(function(x){x.classList.remove('pfactive');});
      this.classList.add('pfactive');
      renderPolariteiten();
    });
  });
}

function setPolFilter(typeNum, basisVal, el) {
  polTypeFilter = typeNum;
  polBasisFilter = basisVal;
  document.querySelectorAll('#pol-type-filter .type-btn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  renderPolariteiten();
}

function renderPolariteiten() {
  if(polView==='type') renderPolType();
  else renderPolPol();
}

// Vaste volgorde basis polariteiten (verleiding-kant)
var BASIS_ORDER = ['Match','Mismatch','Procesgericht','Doelgericht','Proactief','Reactief','Ongeprofileerd','Geprofileerd','Informeel','Formeel','Samen','Apart'];
var polBasisFilter = null; // null = geen filter

function renderPolType() {
  var cats = {'Buiktype':[8,9,1],'Harttype':[2,3,4],'Hoofdtype':[5,6,7]};
  var html = '';
  html += '<div style="display:flex;gap:8px;padding:4px 16px 0">';
  html += '<div style="flex:1;text-align:center;padding:5px 0;background:var(--orange-light);border-radius:6px;font-size:10px;font-weight:600;color:var(--orange);text-transform:uppercase;letter-spacing:0.05em">Verleiding</div>';
  html += '<div style="flex:1;text-align:center;padding:5px 0;background:var(--surface2);border-radius:6px;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em">Vermijding</div>';
  html += '</div>';
  Object.keys(cats).forEach(function(cat){
    html += '<div class="group-header">'+cat+'</div>';
    cats[cat].forEach(function(n){
      var pol = POLARITEITEN[n];
      html += '<div class="card"><div class="card-header" onclick="toggleCard(\'pol\','+n+')">';
      html += '<div style="font-size:15px;font-weight:600">Type '+n+'</div>';
      html += '<span class="chevron" id="pol-ch-'+n+'">&#9662;</span></div>';
      html += '<div class="card-body" id="pol-b-'+n+'">';
      function pairRows(arr) {
        var r = '';
        arr.forEach(function(bp){
          r += '<div class="polarity-row">';
          r += '<div class="polarity-cell kern"><div class="pval">'+bp.v+'</div></div>';
          r += '<div class="polarity-cell"><div class="pval">'+bp.vm+'</div></div>';
          r += '</div>';
        });
        return r;
      }
      html += '<div class="section-label">Basispolariteiten</div>';
      html += pairRows(pol.basis);
      html += '<div class="section-label">Kernkwaliteiten (V-cirkel)</div>';
      html += pairRows(pol.kk);
      html += '<div class="section-label">Typegebonden themas</div>';
      html += pairRows(pol.themas);
      html += '</div></div>';
    });
  });
  document.getElementById('pol-content').innerHTML = html;
}

function renderPolPol() {
  var catOrder = {'Buiktype':[8,9,1],'Harttype':[2,3,4],'Hoofdtype':[5,6,7]};
  var secs = [
    {label:'Basispolariteiten', key:'basis', isBasis:true},
    {label:'Kernkwaliteiten (V-cirkel)', key:'kk', isBasis:false},
    {label:'Typegebonden themas', key:'themas', isBasis:false}
  ];
  var idx = 0;
  secs.forEach(function(sec){
    sec.items = {};
    TYPES.forEach(function(t){
      POLARITEITEN[t.num][sec.key].forEach(function(bp){
        var key = bp.v;
        if(!sec.items[key]) sec.items[key]={v:bp.v,vm:bp.vm,types:[],isBasis:sec.isBasis,idx:idx++};
        if(sec.items[key].types.indexOf(t.num)===-1) sec.items[key].types.push(t.num);
      });
    });
  });

  var html = '';
  secs.forEach(function(sec){
    var items = Object.values(sec.items).filter(function(d){
      var typeOk = (polTypeFilter===0) || d.types.indexOf(polTypeFilter)!==-1;
      var basisOk = (!polBasisFilter) || (d.isBasis && d.v===polBasisFilter);
      if(polBasisFilter) return typeOk && basisOk;
      return typeOk;
    });
    // For basis section, sort by fixed order
    if(sec.isBasis) {
      items.sort(function(a,b){
        return BASIS_ORDER.indexOf(a.v) - BASIS_ORDER.indexOf(b.v);
      });
    }
    if(items.length===0) return;
    html += '<div class="group-header">'+sec.label+'</div>';
    items.forEach(function(data){
      var bid = 'pp2-'+data.idx;
      var cid = 'pp2c-'+data.idx;
      var hasDef = data.isBasis && BASIS_DEFINITIES[data.v];
      var typesStr = data.types.map(function(n){return 'T'+n;}).join(' · ');
      html += '<div class="card">';
      if(hasDef) {
        html += '<div class="card-header" onclick="openModal(\''+data.v+'\')" style="cursor:pointer">';
        html += '<div style="flex:1">';
        html += '<div style="font-size:14px;font-weight:600;color:var(--orange)">'+data.v+'</div>';
        html += '<div style="font-size:12px;color:var(--text2);margin-top:1px">tegenpool: '+data.vm+'</div>';
        html += '<div style="font-size:11px;color:var(--text3);margin-top:2px">'+typesStr+'</div></div>';
        html += '<span style="font-size:10px;background:var(--orange-light);color:var(--orange);padding:2px 8px;border-radius:5px;font-weight:600;flex-shrink:0">basis &#8594;</span>';
        html += '</div>';
      } else {
        html += '<div class="card-header" onclick="toggleCardRaw(\''+bid+'\',\''+cid+'\')" style="cursor:pointer">';
        html += '<div style="flex:1">';
        html += '<div style="font-size:14px;font-weight:600;color:var(--text)">'+data.v+'</div>';
        if(data.isBasis) html += '<div style="font-size:12px;color:var(--text2);margin-top:1px">tegenpool: '+data.vm+'</div>';
        html += '<div style="font-size:11px;color:var(--text3);margin-top:2px">'+typesStr+'</div></div>';
        html += '<span class="chevron" id="'+cid+'">&#9662;</span>';
        html += '</div>';
        html += '<div class="card-body" id="'+bid+'">';
        if(!data.isBasis) {
          html += '<div class="section-label">Vermijding (tegenpool)</div>';
          html += '<div style="font-size:14px;color:var(--text2);margin-bottom:10px">'+data.vm+'</div>';
        }
        html += '<div class="section-label">Aanwezig bij (als verleiding)</div>';
        Object.keys(catOrder).forEach(function(cat){
          var typesInCat = catOrder[cat].filter(function(n){return data.types.indexOf(n)!==-1;});
          if(typesInCat.length>0){
            html += '<div style="font-size:11px;color:var(--text3);margin-bottom:3px;margin-top:4px">'+cat+'</div>';
            html += '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px">';
            typesInCat.forEach(function(n){html += '<span class="pol-badge kern">Type '+n+'</span>';});
            html += '</div>';
          }
        });
        html += '</div>';
      }
      html += '</div>';
    });
  });
  if(html==='') html = '<div class="empty">Geen resultaten voor deze filter</div>';
  document.getElementById('pol-content').innerHTML = html;
}

function toggleCardRaw(bid, cid) {
  var body = document.getElementById(bid);
  var chev = document.getElementById(cid);
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

function openModal(key) {
  var data = BASIS_DEFINITIES[key];
  if(!data) return;
  document.getElementById('def-title').textContent = data.titel;
  document.getElementById('def-sheet').querySelector('.def-subtitle').textContent = 'Basispolariteit - herkenningspunten';
  var parts = data.titel.split(' / ');
  var html = '<table class="def-table"><tr><td class="col-head">'+(parts[0]||'Links')+'</td><td class="col-head">'+(parts[1]||'Rechts')+'</td></tr>';
  data.rijen.forEach(function(row){html += '<tr><td>'+row.l+'</td><td>'+row.r+'</td></tr>';});
  html += '</table>';
  document.getElementById('def-body').innerHTML = html;
  document.getElementById('def-modal').style.display = 'block';
}

function closeModal() {
  document.getElementById('def-modal').style.display = 'none';
}

function renderKwSelector() {
  var sel = document.getElementById('kw-type-selector');
  var html = '';
  TYPES.forEach(function(t){
    html += '<div class="type-btn'+(t.num===kwType?' active':'')+'" onclick="selectKw('+t.num+',this)">Type '+t.num+'</div>';
  });
  sel.innerHTML = html;
}

function selectKw(n, el) {
  kwType = n;
  document.querySelectorAll('#kw-type-selector .type-btn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  renderKwContent();
}

function renderKwContent() {
  var t = TYPES.find(function(x){return x.num===kwType;});
  var data = KWADRANTEN[kwType];
  var html = '<div class="strategy-box" style="margin-bottom:14px"><div class="label">Type '+kwType+' - '+t.cat+'</div><p>'+t.strategie+'</p></div>';
  data.forEach(function(kw){
    html += '<div class="card" style="margin-bottom:10px"><div style="padding:12px 14px">';
    html += '<div class="kw-grid">';
    html += '<div class="kw-cell"><div class="kw-label kw-kk">Kernkwaliteit</div><div class="kw-item">'+kw.kk+'</div></div>';
    html += '<div class="kw-cell"><div class="kw-label kw-vk">Valkuil</div><div class="kw-item">'+kw.vk+'</div></div>';
    html += '<div class="kw-cell"><div class="kw-label kw-al">Allergie</div><div class="kw-item">'+kw.al+'</div></div>';
    html += '<div class="kw-cell"><div class="kw-label kw-ud">Uitdaging</div><div class="kw-item">'+kw.ud+'</div></div>';
    html += '</div></div></div>';
  });
  document.getElementById('kw-content').innerHTML = html;
}

renderVCirkel();
renderPolariteiten();
